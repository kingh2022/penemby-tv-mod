name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build OpenEmby TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenEmby-TV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/OpenEmby-TV-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenEmby TV Build ${{ github.run_number }}
          body: |
            OpenEmby TV 自动构建版本

            Commit: ${{ github.sha }}

            此版本由 GitHub Actions 自动编译。
          files: |
            release/OpenEmby-TV-debug.apk
          generate_release_notes: true
